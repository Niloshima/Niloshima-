<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineZone Arcade - Free Online Voxel & Minecraft Games</title>
    <meta name="description" content="Play trending open-source Minecraft and voxel 3D browser games for free. No download required!">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo">🎮 MineZone Arcade</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Minecraft & 3D games...">
        </div>
    </header>

    <!-- Top Banner Ad Space -->
    <div class="ad-container leaderboard-ad">
        <span class="ad-label">SPONSORED ADVERTISEMENT</span>
        <div class="ad-placeholder">
            <!-- Replace this box with your Adsterra / Monetag / Google AdSense 728x90 code -->
            <p>728 x 90 Leaderboard Ad Space</p>
        </div>
    </div>

    <!-- Main Arcade Content -->
    <main>
        <div class="category-bar">
            <button class="cat-btn active" data-cat="all">All Games</button>
            <button class="cat-btn" data-cat="3d-sandbox">3D Sandbox</button>
            <button class="cat-btn" data-cat="2d-sandbox">2D Sandbox</button>
            <button class="cat-btn" data-cat="arcade">Arcade & Action</button>
        </div>

        <h2 class="section-title">Trending Games</h2>
        
        <!-- Game Cards Grid -->
        <div class="game-grid" id="gameGrid">
            <!-- Dynamically populated via js/games.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MineZone Arcade. Powered by GitHub Pages. Hosted Free Forever.</p>
    </footer>

    <script src="js/games.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
